apiVersion: accelerator.gke.io/v1beta1
kind: Slice
metadata:
  # Name of the Slice resource
  name: invalid-type-slice
  # Namespace where the Slice resource will be created
  namespace: default
spec:
  # Invalid type
  type: "tpu8x"
  # Define the desired topology for the accelerator slice
  topology: "4x4x4"
  # NodeSelector specifies a set of label-based selectors for nodes that can form the slice.
  nodeSelector:
    # This key is a common label for GKE node pools. The value is a list of node pool names to select from.
    cloud.google.com/gke-nodepool:
      - "default-pool"