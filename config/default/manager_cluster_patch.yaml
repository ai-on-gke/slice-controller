# This patch adds the args to configure the cluster identifiers
- op: add
  path: /spec/template/spec/containers/0/args/0
  value: --project-number=123456789012

- op: add
  path: /spec/template/spec/containers/0/args/0
  value: --location=us-central2-b

- op: add
  path: /spec/template/spec/containers/0/args/0
  value: --cluster-name=test-cluster

- op: add
  path: /spec/template/spec/containers/0/args/0
  value: --cluster-hash=testclusterhash