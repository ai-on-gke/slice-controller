apiVersion: components.gke.io/v1
kind: PodResourcePolicy
metadata:
  name: slice-controller-policy
  annotations:
    components.gke.io/layer: master
spec:
  podName: slice-controller
  containerResources:
  - containerName: slice-controller
    limits:
      memory-fraction: 0.2
---
apiVersion: v1
kind: Pod
metadata:
  name: slice-controller
  namespace: kube-system
  annotations:
    # Annotation to indicate this is used by Component Release Pipeline.
    components.gke.io/system: pipeline
    # Indicate that this should be deployed on the master.
    components.gke.io/layer: master
    # Indicates that this component will need a kubeconfig to communicate with the apiserver
    components.gke.io/bootstrap-auth: slice-controller
spec:
  securityContext:
    runAsUser: 2703
    runAsGroup: 2703
    seccompProfile:
      type: RuntimeDefault
  hostNetwork: true
  containers:
  - name: slice-controller
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - all
    command:
    - /manager
    args:
    - --metrics-bind-address=:22003
    - --metrics-secure=false
    - --kubeconfig=/etc/srv/kubernetes/slice-controller/kubeconfig
    - --leader-elect
    - --cloud-config=/etc/gce.conf
    - --project-number={{.ProjectNumber}}
    - --location={{.Location}}
    - --cluster-name={{.ClusterName}}
    - --cluster-hash={{.ClusterHash}}
    - --slice-reconciler-worker-count=128
    - --webhook-server-cert={{.WebhookServerCert}}
    - --webhook-server-key={{.WebhookServerKey}}
    - --webhook-server-port=22002
    - --enable-linked-runner={{.EnableLinkedRunners}}
    - --enable-slice-update=true
    - --support-subslice-update=true
    env:
    - name: CLOUD_MONITORING_ENDPOINT
      value: "{{.MonitoringEndpoint}}"
    - name: CONSUMER_PROJECT
      value: "{{.ProjectNumber}}"
    - name: CLUSTER_LOCATION
      value: "{{.Location}}"
    - name: CLUSTER_HASH
      value: "{{.ClusterHash}}"
    - name: CLUSTER_NAME
      value: "{{.ClusterName}}"
    - name: CLUSTER_PROJECT
      value: "{{.ClusterProject}}"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: CONTAINER_NAME
      value: "slice-controller"
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    image: "{{.imgSliceController}}"
    volumeMounts:
    - name: gceconf
      mountPath: /etc/gce.conf
      readOnly: true
    - name: srvkube
      mountPath: /etc/srv/kubernetes/slice-controller
      readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
  volumes:
  - name: srvkube
    hostPath:
      path: /etc/srv/kubernetes/slice-controller
      type: DirectoryOrCreate
  - name: gceconf
    hostPath:
      path: /etc/gce.conf
      type: FileOrCreate